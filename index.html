<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101713" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="श्रुति — संस्कृत, हिंदी और वैदिक पाठ के लिए स्थानीय वाचन तथा 9:16 वीडियो स्टूडियो।"
    />
    <meta name="application-name" content="श्रुति — वैदिक वीडियो वाचन" />
    <meta name="referrer" content="no-referrer" />
    <title>श्रुति | वैदिक वीडियो वाचन स्टूडियो</title>

    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans Devanagari",
          "Nirmala UI", sans-serif;
        background: #101713;
        color: #f4f4ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; }
      body { min-height: 100vh; }
      #root { min-height: 100vh; }
      .boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(183, 133, 55, .13), transparent 48%),
          #101713;
      }
      .boot-card {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #354039;
        border-radius: 20px;
        background: rgba(24, 33, 27, .92);
        text-align: center;
      }
      .boot-mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        place-items: center;
        border: 1px solid #987342;
        border-radius: 16px;
        color: #f0d19a;
        font-size: 28px;
      }
      .boot-card h1 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: .01em; }
      .boot-card p { margin: 10px 0 0; color: #bac4bb; line-height: 1.7; font-size: 14px; }
      .boot-progress {
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 99px;
        background: #354039;
      }
      .boot-progress span {
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #d6b16d;
        animation: boot-slide 1.4s ease-in-out infinite alternate;
      }
      @keyframes boot-slide { from { transform: translateX(0); } to { transform: translateX(185%); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-live="polite" aria-busy="true">
        <section class="boot-card" aria-label="श्रुति ऐप लोड हो रहा है">
          <div class="boot-mark" aria-hidden="true">श्री</div>
          <h1>श्रुति</h1>
          <p>वैदिक वीडियो वाचन स्टूडियो<br />ऐप तैयार किया जा रहा है…</p>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <noscript>
      <div style="max-width: 640px; margin: 48px auto; padding: 24px; font-family: sans-serif; line-height: 1.7;">
        <h1>श्रुति — वैदिक वीडियो वाचन</h1>
        <p>इस ऐप को चलाने के लिए JavaScript सक्षम होना आवश्यक है। कृपया ब्राउज़र सेटिंग में JavaScript चालू करके पृष्ठ फिर खोलें।</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
