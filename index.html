<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17142b" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="श्रुति — संस्कृत, हिंदी एवं वैदिक पाठ के वाचन और 9:16 वीडियो प्रदर्शन के लिए स्टूडियो।"
    />
    <meta name="application-name" content="श्रुति" />
    <title>श्रुति — वैदिक पाठ वाचन स्टूडियो</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans Devanagari", "Mangal", sans-serif;
        background: #100f1e;
        color: #fffaf0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(117 72 179 / 25%), transparent 58%),
          linear-gradient(155deg, #18152b 0%, #100f1e 54%, #1c132b 100%);
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .shruti-boot {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }

      .shruti-boot__panel {
        width: min(100%, 440px);
        padding: clamp(28px, 8vw, 44px) 24px;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 28px;
        background: linear-gradient(145deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%));
        box-shadow: 0 24px 80px rgb(0 0 0 / 27%);
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .shruti-boot__mark {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        place-items: center;
        border: 1px solid rgb(255 211 133 / 40%);
        border-radius: 24px;
        background: linear-gradient(145deg, #61418c, #2a2148);
        color: #ffe2a7;
        font-size: 38px;
        line-height: 1;
        box-shadow: inset 0 1px rgb(255 255 255 / 15%), 0 10px 28px rgb(0 0 0 / 22%);
      }

      .shruti-boot__title {
        margin: 0;
        color: #fff4dc;
        font-size: clamp(30px, 8vw, 40px);
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .shruti-boot__subtitle {
        margin: 12px 0 0;
        color: #e4d7f7;
        font-size: 15px;
        line-height: 1.8;
      }

      .shruti-boot__status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
        color: #d8cce8;
        font-size: 13px;
      }

      .shruti-boot__spinner {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        border: 2px solid rgb(255 255 255 / 25%);
        border-top-color: #ffcf80;
        border-radius: 50%;
        animation: shruti-spin 0.85s linear infinite;
      }

      .shruti-boot__note {
        max-width: 32ch;
        margin: 20px auto 0;
        color: #b7acc8;
        font-size: 12px;
        line-height: 1.7;
      }

      @keyframes shruti-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="shruti-boot" aria-labelledby="shruti-boot-title">
        <section class="shruti-boot__panel" aria-describedby="shruti-boot-subtitle shruti-boot-note">
          <div class="shruti-boot__mark" aria-hidden="true">श्री</div>
          <h1 class="shruti-boot__title" id="shruti-boot-title">श्रुति</h1>
          <p class="shruti-boot__subtitle" id="shruti-boot-subtitle">
            संस्कृत, हिंदी एवं वैदिक पाठ वाचन स्टूडियो
          </p>
          <div class="shruti-boot__status" role="status" aria-live="polite">
            <span class="shruti-boot__spinner" aria-hidden="true"></span>
            <span>स्टूडियो लोड हो रहा है…</span>
          </div>
          <p class="shruti-boot__note" id="shruti-boot-note">
            यदि यह स्क्रीन लगातार बनी रहे, तो ऐप की स्क्रिप्ट या प्रकाशित बिल्ड की जाँच आवश्यक है।
          </p>
        </section>
      </main>
    </div>

    <noscript>
      <p style="margin: 0; padding: 1rem; color: #fff; background: #8b1e3f; text-align: center;">
        श्रुति चलाने के लिए इस ब्राउज़र में JavaScript चालू होना आवश्यक है।
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
